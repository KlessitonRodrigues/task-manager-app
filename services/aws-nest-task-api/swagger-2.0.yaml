swagger: '2.0'
info:
  title: Task Management API
  description: |
    Swagger 2.0 specification for the task-management-api service

    ## API Response Codes

    ### Success Codes
    | Code  | Message |
    |-------|---------|
    | SUC000 | Success |
    | SUC001 | Created successfully |
    | SUC002 | Updated successfully |
    | SUC003 | Deleted successfully |
    | SUC004 | Fetched successfully |

    ### Error Codes
    | Code  | Message |
    |-------|---------|
    | ERR000 | Invalid request |
    | ERR001 | Internal server error |
    | ERR002 | User not found |
    | ERR003 | User already exists |
    | ERR004 | Invalid credentials |
    | ERR005 | Invalid token |
    | ERR006 | Expired token |
    | ERR007 | Unauthorized |
  version: '1.0.0'
host: localhost:3000
basePath: /
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json

x-api-response-codes:
  # Success Codes
  SUC000: Success
  SUC001: Created successfully
  SUC002: Updated successfully
  SUC003: Deleted successfully
  SUC004: Fetched successfully
  # Error Codes
  ERR000: Invalid request
  ERR001: Internal server error
  ERR002: User not found
  ERR003: User already exists
  ERR004: Invalid credentials
  ERR005: Invalid token
  ERR006: Expired token
  ERR007: Unauthorized
  ERR008: Task not found

paths:
  /:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Successful response with greeting text.
          schema:
            type: string
          examples:
            application/json: Hello World!
  /task:
    get:
      tags:
        - Task
      summary: Get all tasks
      operationId: findAllTasks
      responses:
        '200':
          description: List of tasks.
          schema:
            type: array
            items:
              type: object
              properties:
                pk:
                  type: string
                  format: uuid
                sk:
                  type: string
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                priority:
                  type: string
                dueDate:
                  type: string
                progressList:
                  type: array
                  items:
                    type: string
                createdAt:
                  type: string
    post:
      tags:
        - Task
      summary: Create a new task
      operationId: createTask
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 200
              description:
                type: string
              status:
                type: string
                default: pending
              priority:
                type: string
                default: normal
              dueDate:
                type: string
              progressList:
                type: array
                items:
                  type: string
      responses:
        '201':
          description: Task created successfully.
          schema:
            type: object
            properties:
              pk:
                type: string
                format: uuid
              sk:
                type: string
              name:
                type: string
              description:
                type: string
              status:
                type: string
              priority:
                type: string
              dueDate:
                type: string
              progressList:
                type: array
                items:
                  type: string
              createdAt:
                type: string

  /task/{id}:
    get:
      tags:
        - Task
      summary: Get task by ID
      operationId: findOneTask
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        '200':
          description: Task found.
          schema:
            type: object
            properties:
              pk:
                type: string
                format: uuid
              sk:
                type: string
              name:
                type: string
              description:
                type: string
              status:
                type: string
              priority:
                type: string
              dueDate:
                type: string
              progressList:
                type: array
                items:
                  type: string
              createdAt:
                type: string
        '404':
          description: Task not found.
          schema:
            type: object
    put:
      tags:
        - Task
      summary: Update task by ID
      operationId: updateTask
      parameters:
        - in: path
          name: id
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 200
              description:
                type: string
              status:
                type: string
              priority:
                type: string
              dueDate:
                type: string
              progressList:
                type: array
                items:
                  type: string
      responses:
        '200':
          description: Task updated successfully.
          schema:
            type: object
        '404':
          description: Task not found.
          schema:
            type: object
    delete:
      tags:
        - Task
      summary: Delete task by ID
      operationId: deleteTask
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        '200':
          description: Task deleted successfully.
          schema:
            $ref: '#/definitions/DeleteResponse'
        '404':
          description: Task not found.
          schema:
            type: object
